# ============================================================
# Bangalore Job Alert Pipeline — curated company list
# All companies are ~500-10,000 employees (verified live boards),
# Bangalore HQ / branch, or remote-India friendly.
# ats: greenhouse | lever
# size: approximate headcount, shown in alert emails
# Add/remove companies freely — dead boards are skipped automatically.
# NOTE: companies running private ATSs (PhonePe, Swiggy, Zepto, Razorpay,
# Flipkart...) can't be covered without scraping — add on request if one
# switches to Greenhouse/Lever.
# ============================================================

settings:
  # ---- Role filter (title keywords, lowercase, substring match) ----
  include_titles:
    - java
    - spring
    - backend
    - back-end
    - back end
    - full stack
    - full-stack
    - fullstack
    - software engineer
    - software developer
    - sde
    - member of technical staff
    - platform engineer
    - react
    - node

  # Noise / too-senior filters (applied BEFORE include list)
  exclude_titles:
    - developer advocate
    - developer relations
    - devrel
    - sales
    - account manager
    - recruit
    - talent
    - people
    - intern
    - internship
    - graduate
    - machine learning
    - ml engineer
    - deep learning
    - data science
    - data scientist
    - data engineer
    - campus
    - qa
    - quality assurance
    - test engineer
    - support engineer
    - technical account
    - solution engineer
    - solutions engineer
    - solution architect
    - solutions architect
    - presales
    - pre-sales
    - engineering manager
    - product manager
    - program manager
    - project manager
    - staff
    - principal
    - senior
    - sr
    - sse
    - ml
    - trainee
    - fresher
    - entry level
    - architect
    - director
    - vp
    - head of
    - lead

  # ---- Location filter (matched against location + title) ----
  location_include:
    - bangalore
    - bengaluru
    - blr
    - karnataka

  # Also accept "Remote - India" style listings
  remote_india_ok: true

  # Only alert jobs PUBLISHED within the last N hours ("posted today").
  # Older listings are never emailed, even if first detected later.
  max_job_age_hours: 26

  # ---- Profile match scoring (description-level, keywords from resume) ----
  # A job is emailed only if its weighted score >= min_profile_score.
  # Title hit = weight x2, description hit = weight x1.
  # 4 = balanced (java+rest+aws passes). Raise to 6-8 for ultra-strict matching.
  min_profile_score: 4

  # ---- Experience fit (profile: ~2 years) ----
  # Postings that STATE an explicit range (e.g. "4-7 years", "5+ yrs") are
  # dropped unless the range fits. No explicit range => always passes.
  experience_target_years: 2
  experience_max_asks: 3       # posting asks for more than 3y min => too senior
  experience_min_asks: 1.5     # posting caps below 1.5y => fresher-level, skip

  # Aggregator sources (Adzuna/JSearch) carry agency spam — demand a higher
  # profile score from them than from direct company boards:
  aggregator_min_profile_score: 6

  profile_keywords:
    spring boot: 3
    spring: 3
    java: 2
    microservices: 2
    react: 2
    typescript: 2
    full stack: 2
    full-stack: 2
    node: 1
    javascript: 1
    rest api: 1
    restful: 1
    hibernate: 1
    jpa: 1
    aws: 1
    docker: 1
    kubernetes: 1
    redis: 1
    mysql: 1
    postgresql: 1

  max_email_jobs: 30     # cap rows per alert email
  state_path: state/seen_jobs.json
  outbox_path: outbox

