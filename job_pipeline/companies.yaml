# ============================================================
# Bangalore Job Alert Pipeline — curated company list
# All companies are ~500-10,000 employees (verified live boards)
# ats: greenhouse | lever
# size: approximate headcount, shown in alert emails
# Add/remove companies freely — dead boards are skipped automatically.
# ============================================================

settings:
  # ---- Role filter (title keywords, lowercase, substring match) ----
  include_titles:
    - java
    - spring
    - backend
    - back-end
    - back end
    - full stack
    - full-stack
    - fullstack
    - software engineer
    - software developer
    - sde
    - member of technical staff
    - platform engineer
    - react
    - node

  # Noise / too-senior filters (applied BEFORE include list)
  exclude_titles:
    - developer advocate
    - developer relations
    - devrel
    - sales
    - account manager
    - recruit
    - talent
    - people
    - intern
    - internship
    - graduate
    - campus
    - qa
    - quality assurance
    - test engineer
    - support engineer
    - technical account
    - solution engineer
    - solutions engineer
    - solution architect
    - solutions architect
    - presales
    - pre-sales
    - engineering manager
    - product manager
    - program manager
    - project manager
    - staff
    - principal
    - senior
    - sr.
    - "sr "
    - architect
    - director
    - vp
    - head of
    - lead

  # ---- Location filter (matched against location + title) ----
  location_include:
    - bangalore
    - bengaluru
    - blr
    - karnataka

  # Also accept "Remote - India" style listings
  remote_india_ok: true

  max_email_jobs: 30     # cap rows per alert email
  state_path: state/seen_jobs.json
  outbox_path: outbox

companies:
  # ---------- Product companies & GCCs (Greenhouse) ----------
  - {name: Postman,       ats: greenhouse, slug: postman,       size: "~900"}
